<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="chatbot-page">

<!-- NAVBAR -->
<div class="navbar">
  <h2 class="logo">Data Scientest Graduation Project</h2>

  <div class="nav-links">
    <a href="{{ url_for('main_home') }}">Home</a>
    <a href="{{ url_for('recommendation') }}">Recommendation</a>
    <a href="{{ url_for('waiting') }}">Waiting Time</a>
    <a href="{{ url_for('reviews') }}">Reviews</a>
    <a href="{{ url_for('emergency') }}" class="active">Emergency Assistant</a>
  </div>
</div>


<div class="chat-container">

  <!-- HEADER -->
  <div class="chat-header">
    <h2>Emergency Assistant</h2>
    <p>Hello 👋 how can I help you?</p>
  </div>

  <!-- CHAT -->
  <div id="chatBox" class="chat-box"></div>

  <div class="chat-input">
    <input id="userInput" placeholder="Describe your situation..." />
    <button onclick="sendMessage()">Send</button>
  </div>

</div>
</div>

<!-- JS -->
<script>
function sendMessage(){

  let input = document.getElementById("userInput");
  let text = input.value.trim();

  if(!text) return;

  let chatBox = document.getElementById("chatBox");

  // ===== USER MESSAGE =====
  chatBox.innerHTML += `
    <div class="msg-row user">
      <div class="message user">${text}</div>
    </div>
  `;

  input.value = "";

  // ===== TYPING =====
  let typingDiv = document.createElement("div");
  typingDiv.className = "msg-row bot";
  typingDiv.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="message bot typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  chatBox.appendChild(typingDiv);
  chatBox.scrollTop = chatBox.scrollHeight;

  // ===== FETCH =====
  fetch("/emergency_action", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({situation: text})
  })
  .then(res => res.json())
  .then(data => {

    typingDiv.remove();

    chatBox.innerHTML += `
      <div class="msg-row bot">
        <div class="avatar">🤖</div>
        <div class="message bot">${data.response}</div>
      </div>
    `;

    chatBox.scrollTop = chatBox.scrollHeight;

  })
  .catch(() => {

    typingDiv.remove();

    chatBox.innerHTML += `
      <div class="msg-row bot">
        <div class="avatar">⚠️</div>
        <div class="message error">Server error</div>
      </div>
    `;
  });
}


</script>

<div class="footer">
  Developed By Data Science Students - College of Computing 2026
</div>

</body>
</html>
