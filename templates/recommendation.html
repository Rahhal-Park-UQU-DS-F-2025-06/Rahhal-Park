<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recommendation</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="recommendation-page">

<div class="navbar">
  <h2 class="logo">Data Scientest Graduation Project</h2>

  <div class="nav-links">
    <a href="{{ url_for('main_home') }}">Home</a>
    <a href="{{ url_for('recommendation') }}" class="active">Recommendation</a>
    <a href="{{ url_for('waiting') }}">Waiting Time</a>
    <a href="{{ url_for('reviews') }}">Reviews</a>
    <a href="{{ url_for('emergency') }}">Emergency Assistant</a>
  </div>
</div>

<div class="main">

  <!-- Title -->
  <div class="title-card">
    <h1>Find Your Perfect Experience</h1>
    <p>Answer a few quick questions to get the best recommendation for you</p>
  </div>

  <!-- Form -->
  <div class="card">

    <div class="form-grid">

      <div class="form-group">
        <label>Age Group</label>
        <select id="age">
          <option>teen (13-18)</option>
          <option>young adult (19–30)</option>
          <option>adult (31-50)</option>
          <option>older adult (51+)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Weight (kg)</label>
        <input type="number" id="weight">
      </div>

      <div class="form-group">
        <label>Diseases</label>
        <select id="disease">
          <option>none</option>
          <option>asthma</option>
          <option>diabetes</option>
          <option>epilepsy</option>
          <option>heart disease</option>
          <option>hypertension</option>
          <option>other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Group Type</label>
        <select id="group">
          <option>alone</option>
          <option>family</option>
          <option>friends</option>
          <option>work group</option>
        </select>
      </div>

      <div class="form-group">
        <label>Preference</label>
        <select id="pref">
          <option>adventure</option>
          <option>family-friendly</option>
          <option>horror</option>
          <option>mystery</option>
          <option>relaxation</option>
          <option>thrill</option>
        </select>
      </div>

      <div class="form-group">
        <label>Height (cm)</label>
        <input type="number" id="height">
      </div>

      <div class="form-group">
        <label>Do you fear of Heights?</label>
        <select id="fear">
          <option>no</option>
          <option>yes</option>
        </select>
      </div>

    </div>

    <button class="btn" onclick="getRecommendation(event)">Get Recommendation</button>

    <div id="resultCards" class="result-cards"></div>

  </div>

</div>

<script>
function getRecommendation(event){
  event.preventDefault();

  const data = {
    age: document.getElementById("age").value,
    weight: document.getElementById("weight").value,
    disease: document.getElementById("disease").value,
    group: document.getElementById("group").value,
    preference: document.getElementById("pref").value,
    height: document.getElementById("height").value,
    fear: document.getElementById("fear").value
  };

  fetch("/recommend", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(response => {

    let result = {
      name: "Your Recommendation",
      desc: "Based on your answers",
      level: response.best_fit,
      activities: response.example
    };

    displayResult(result);
  })
  .catch(error => {
    console.error(error);
    alert("Error connecting to server");
  });
}


function displayResult(ride){

  let container = document.getElementById("resultCards");

  container.innerHTML = `
    <div class="result-card">
      <h3> ${ride.name}</h3>
      <p>${ride.desc}</p>

      <p><strong>Best Fit:</strong></p>
      <p>${ride.level}</p>

      <p><strong>Suggested Activities:</strong></p>
      <ul>
        ${ride.activities 
          ? ride.activities.split(',').map(x => `<li>${x.trim()}</li>`).join('')
          : '<li>-</li>'}
      </ul>

      <p style="opacity:0.7;">Enjoy, hava a great day</p>
    </div>
  `;

 
}
</script>

<div class="footer">
  Developed By Data Science Students - College of Computing 2026
</div>

</body>
</html>l>
